services:
  securaiq:
    build: .
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      AUTH_ENABLED: "true"
      AUTH_ALLOW_REGISTER: "false"
      BOOTSTRAP_ADMIN_USERNAME: "admin"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-changeme-change-me}"
      MFA_REQUIRED_FOR_ADMIN: "${MFA_REQUIRED_FOR_ADMIN:-false}"
      MODEL_BACKEND: "ollama"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      DATA_DIR: "/data"
      CHROMA_PERSIST_DIR: "/data/chroma"
      QDRANT_URL: "${QDRANT_URL:-}"
      QDRANT_COLLECTION: "securaiq_knowledge"
      DATABASE_URL: "${DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-http://127.0.0.1:8080/api/auth/oidc/callback}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
    volumes:
      - securaiq-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securaiq
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-securaiq}"
      POSTGRES_DB: securaiq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    profiles: ["postgres", "saas"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles: ["redis", "saas"]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    profiles: ["vectors"]

  # Optional Prefect server for multi-worker job orchestration
  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
    restart: unless-stopped
    profiles: ["prefect"]

volumes:
  securaiq-data:
  postgres-data:
  qdrant-data:
